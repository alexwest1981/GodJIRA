<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GodJIRA</title>
<style>
  /* Plane's anatomy, our data: icon rail + nav sidebar, breadcrumb header with a
     view switcher, columns with a state icon and a count, work-item cards with
     type glyph, id, title, then one property row (priority bars, state pill,
     due date) and avatars, plus a table of every work item across both sources.
     No writes: the panel reads the same CLI the flow uses, and never decides. */
  :root {
    --bg: #0b0b0e; --rail: #08080a; --side: #101014; --panel: #16161b;
    --card: #1b1b21; --card-hi: #212128; --line: #26262e; --line-2: #33333d;
    --text: #ececf1; --text-2: #a5a5b3; --muted: #71717f;
    --blue: #4d7cfe; --amber: #e0a33e; --red: #e5545f; --green: #48b98a; --violet: #9b7bf0;
    --r: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); display: flex; min-height: 100vh;
    font: 13.5px/1.45 ui-sans-serif, system-ui, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  .col { display: flex; flex-direction: column; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .key { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  .empty { color: var(--text-2); font-size: 12.5px; padding: 3px 0; }
  .err { color: var(--red); }

  /* ------------------------------------------------------------ icon rail */
  .rail {
    width: 58px; flex: 0 0 58px; background: var(--rail); border-right: 1px solid var(--line);
    align-items: center; gap: 12px; padding: 12px 0; position: sticky; top: 0; height: 100vh;
  }
  .rail .mark {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--blue), var(--violet)); font-weight: 700; color: #fff;
  }
  .railitem {
    width: 46px; display: grid; place-items: center; gap: 3px; padding: 6px 0; border-radius: 8px;
    color: var(--muted); cursor: pointer; font-size: 9px; letter-spacing: .04em; text-transform: uppercase;
  }
  .railitem .g { font-size: 15px; line-height: 1; }
  .railitem:hover { background: var(--panel); color: var(--text-2); }
  .railitem.on { background: var(--panel); color: var(--text); }
  .railitem.on .g { color: var(--blue); }

  /* -------------------------------------------------------------- sidebar */
  .side {
    width: 248px; flex: 0 0 248px; background: var(--side); border-right: 1px solid var(--line);
    padding: 12px 10px; gap: 3px; overflow-y: auto; position: sticky; top: 0; height: 100vh;
  }
  .side .head { display: flex; align-items: center; gap: 8px; padding: 2px 6px 10px; }
  .side .head b { font-size: 14.5px; font-weight: 600; }
  .ghost {
    background: transparent; border: 1px solid var(--line-2); color: var(--text-2);
    border-radius: var(--r); padding: 3px 8px; font-size: 12px; cursor: pointer;
  }
  .ghost:hover { border-color: #4a4a58; color: var(--text); }
  .item {
    display: flex; align-items: center; gap: 9px; padding: 6.5px 9px; border-radius: var(--r);
    color: var(--text-2); cursor: pointer; font-size: 13px;
  }
  .item .g { width: 15px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .item:hover { background: var(--panel); color: var(--text); }
  .item.on { background: var(--card-hi); color: var(--text); }
  .item .c { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .sect { margin: 14px 0 4px; padding: 0 9px; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .sub { margin-left: 12px; border-left: 1px solid var(--line); padding-left: 6px; }
  .who { margin-top: auto; padding: 10px 8px 2px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }

  /* ----------------------------------------------------------------- main */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header.top {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line);
    background: var(--bg); position: sticky; top: 0; z-index: 5;
  }
  .crumbs { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .crumbs .sep { color: var(--muted); }
  .crumbs b { font-weight: 600; }
  .seg { display: flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
  .seg button { background: transparent; border: 0; color: var(--muted); padding: 4px 9px; cursor: pointer; font-size: 13px; }
  .seg button:hover { color: var(--text); background: var(--panel); }
  .seg button.on { background: var(--card-hi); color: var(--text); }
  input[type="search"] {
    background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r); color: var(--text);
    padding: 5px 10px; font: inherit; font-size: 12.5px; min-width: 200px;
  }
  .wrap { padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 16px; }
  .view { display: none; flex-direction: column; gap: 16px; }
  .view.on { display: flex; }

  /* -------------------------------------------------------------- overview */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 13px; }
  .stat .n { font-size: 23px; font-weight: 600; letter-spacing: -.01em; }
  .stat .l { color: var(--text-2); font-size: 12px; }
  .stat .x { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  .two { display: grid; grid-template-columns: 1.05fr .95fr; gap: 16px; align-items: start; }
  @media (max-width: 1080px) { .two { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .panel > h3 {
    margin: 0; padding: 10px 13px; border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .panel > h3 .meta { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 11px; }
  .panel .body { padding: 12px 13px; }
  .wl .r { display: flex; align-items: center; gap: 9px; padding: 7px 2px; border-bottom: 1px solid var(--line); }
  .wl .r:last-child { border-bottom: 0; }
  .wl .r .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wl .r .tside { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }

  /* ----------------------------------------------------------------- board */
  .cols { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; align-items: flex-start; }
  .bcol { flex: 0 0 296px; }
  .bcol > h3 { margin: 0 0 9px; padding: 0 4px; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
  .bcol > h3 .c { color: var(--muted); font-weight: 400; font-size: 12px; }
  .bcol .stack { display: flex; flex-direction: column; gap: 8px; max-height: 68vh; overflow-y: auto; padding: 1px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; }
  .card:hover { background: var(--card-hi); border-color: var(--line-2); }
  .card .c1 { display: flex; align-items: center; gap: 7px; }
  .card .t {
    margin: 5px 0 9px; font-size: 13px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .c2 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
  .typeg { font-size: 12px; line-height: 1; }

  .avatar {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-size: 10px; font-weight: 600; color: #0b0b0e; flex: 0 0 22px;
  }
  .avatar.sm { width: 20px; height: 20px; flex-basis: 20px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 1.5px 7px; border: 1px solid var(--line-2);
    border-radius: 5px; font-size: 11.5px; color: var(--text-2); background: #ffffff08;
    white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: 0 0 7px; }
  .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; }
  .bars i { width: 2.5px; border-radius: 1px; background: var(--line-2); display: block; }
  .bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 7px; } .bars i:nth-child(3) { height: 10px; }
  .bars.p3 i { background: var(--red); }
  .bars.p2 i:nth-child(-n+2) { background: var(--amber); }
  .bars.p1 i:nth-child(1) { background: var(--blue); }
  .excl {
    display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 4px;
    background: #e5545f22; color: var(--red); font-size: 10px; font-weight: 700;
  }
  .cardflag { font-size: 11px; color: var(--amber); }

  /* ----------------------------------------------------------------- table */
  .tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 72vh; }
  /* Fixed layout so the header widths hold: a long sprint name clips in its cell
     instead of wrapping and stretching one row taller than its neighbours. */
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td, td .muted { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.muted { color: var(--text-2); }
  th {
    color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    background: var(--panel); position: sticky; top: 0; z-index: 1;
  }
  tr:hover td { background: #ffffff06; }
  td .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 460px; }
  td.num { text-align: right; color: var(--muted); }
  .src { font-size: 10px; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<nav class="rail col" id="rail"></nav>
<aside class="side col" id="side"></aside>

<main>
  <header class="top">
    <div class="crumbs" id="crumbs"></div>
    <span class="grow"></span>
    <div class="seg" id="seg"></div>
    <input type="search" id="filter" placeholder="filtrera">
    <button class="ghost" id="refresh">Uppdatera</button>
  </header>

  <div class="wrap">
    <section class="view on" id="v-overview">
      <div class="stats" id="stats"></div>
      <div class="two">
        <div class="panel">
          <h3>Flödets nästa <span class="meta">jira_flow.py next --dry-run</span></h3>
          <div class="body" id="flowPick"></div>
        </div>
        <div class="panel">
          <h3>Flödets egna skrivningar <span class="meta">journal</span></h3>
          <div class="body" id="journal"></div>
        </div>
      </div>
      <div class="panel">
        <h3>Senast rörda repon <span class="meta" id="recentMeta"></span></h3>
        <div class="body" id="recent"></div>
      </div>
    </section>

    <section class="view" id="v-board">
      <div class="empty" id="sprintNote"></div>
      <div class="cols" id="cols"></div>
    </section>

    <section class="view" id="v-items">
      <div class="tablewrap"><table id="itemsTable"></table></div>
    </section>

    <section class="view" id="v-repos">
      <div class="tablewrap"><table id="repoTable"></table></div>
      <div class="two">
        <div class="panel">
          <h3>Öppna pull requests <span class="meta" id="prMeta"></span></h3>
          <div class="body wl" id="prs"></div>
        </div>
        <div class="panel">
          <h3>Öppna ärenden <span class="meta" id="issMeta"></span></h3>
          <div class="body wl" id="issues"></div>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
const TEXT = {
  views: { overview: ["Översikt", "◫"], board: ["Tavlan", "▤"], items: ["Uppgifter", "☰"], repos: ["Repon", "⌥"] },
  next: "nästa", empty: "Inga ärenden", never: "aldrig", nothing: "inget",
  someoneElses: "är någon annans — tas från panelens andra tryck",
  runnersUp: "därefter", noSprint: "ingen aktiv sprint — det som är kvar står i backloggen och ligger i To Do här",
  open: "öppna", settled: "klara", backlog: "i backloggen", repos: "repon", waiting: "väntar på dig",
  allTasks: "Alla uppgifter", sources: "Jira + GitHub",
};
let STATE = null, view = "board";

/* ---------------------------------------------------------------- bitar --- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(iso) {
  const t = new Date(iso).getTime(); if (!t) return TEXT.never;
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "nyss"; if (m < 60) return m + " min";
  const h = Math.round(m / 60); if (h < 24) return h + " h"; return Math.round(h / 24) + " d";
}
const MON = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const dt = ms => { if (!ms) return ""; const d = new Date(ms); return d.getDate() + " " + MON[d.getMonth()]; };
const hhmm = () => new Date().toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });

// Plane's type icon: one glyph per work-item type, coloured by type.
const TYPE = [["epic", "◆", "#9b7bf0"], ["story", "▣", "#48b98a"], ["task", "▤", "#4d7cfe"],
              ["bug", "●", "#e5545f"], ["subtask", "↳", "#71717f"]];
function typeGlyph(name) {
  const k = String(name || "").toLowerCase();
  const hit = TYPE.find(([key]) => k.includes(key)) || ["", "▫", "#a5a5b3"];
  return `<span class="typeg" style="color:${hit[2]}" title="${esc(name || "")}">${hit[1]}</span>`;
}
// Plane's state icon: hollow for new, amber for in-flight, green for done.
function stateDot(cat) {
  const c = cat === "done" ? "var(--green)" : cat === "indeterminate" ? "var(--amber)" : "var(--muted)";
  return `<span class="dot" style="background:${c}"></span>`;
}
// Plane's priority icon: signal bars for High/Medium/Low, a red box for Highest/Urgent.
function prio(name) {
  const p = String(name || "").toLowerCase();
  const t = `title="${esc(name)}"`;
  if (p.startsWith("highest") || p.includes("urgent")) return `<span class="excl" ${t}>!</span>`;
  if (p.startsWith("high")) return `<span class="bars p3" ${t}><i></i><i></i><i></i></span>`;
  if (p.startsWith("med")) return `<span class="bars p2" ${t}><i></i><i></i><i></i></span>`;
  if (p.startsWith("low")) return `<span class="bars p1" ${t}><i></i><i></i><i></i></span>`;
  return "";
}
const HUE = ["#4d7cfe", "#48b98a", "#e0a33e", "#9b7bf0", "#e5545f", "#3fb6c9"];
function avatar(name, small) {
  if (!name) return "";
  const h = [...name].reduce((a, c) => a + c.charCodeAt(0), 0);
  const ini = name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  return `<span class="avatar${small ? " sm" : ""}" style="background:${HUE[h % HUE.length]}" title="${esc(name)}">${esc(ini)}</span>`;
}

/* --------------------------------------------------------------- data ---- */
const board = () => (STATE.jira.boards || [])[0] || null;
const issues = () => (board() || {}).issues || [];
const backlog = () => (board() || {}).backlog || [];
// The board endpoint keeps the settled work and the backlog keeps the live work
// (no active sprint). Same keys never appear in both -- measured 0 of 93+38 -- so
// the board is shown the way the flow sees it.
function boardItems() {
  const seen = new Set();
  return issues().concat(backlog()).filter(i => !seen.has(i.key) && seen.add(i.key));
}
const openItems = () => boardItems().filter(i => i.statusCategory !== "done");
// GitHub's open work shaped as work items, so one table can hold both sources.
function ghItems() {
  const g = STATE.github, out = [];
  g.pullRequests.forEach(p => out.push({
    source: "GH", key: `${p.repository.nameWithOwner || p.repository.name}#${p.number}`,
    summary: p.title, url: p.url, typeName: p.isDraft ? "Draft" : "Pull request",
    statusName: p.isDraft ? "Draft" : "Open", statusCategory: "indeterminate", when: p.updatedAt,
  }));
  g.issues.forEach(i => out.push({
    source: "GH", key: `${i.repository.nameWithOwner || i.repository.name}#${i.number}`,
    summary: i.title, url: i.url, typeName: "Issue", statusName: "Open",
    statusCategory: "indeterminate", when: i.updatedAt,
  }));
  return out;
}
const matches = x => {
  const q = (document.getElementById("filter").value || "").toLowerCase();
  return !q || (x.key + " " + (x.summary || "") + " " + (x.assigneeName || "")).toLowerCase().includes(q);
};
const link = (url, inner) => url ? `<a href="${esc(url)}" target="_blank" rel="noreferrer">${inner}</a>` : inner;

/* ------------------------------------------------------------- render ---- */
function renderRail() {
  document.getElementById("rail").innerHTML = `<div class="mark">G</div>` + Object.entries(TEXT.views).map(([v, [label, glyph]]) =>
    `<div class="railitem ${v === view ? "on" : ""}" data-v="${v}"><span class="g">${glyph}</span>${label}</div>`).join("");
}

function renderSide() {
  const j = STATE.jira, g = STATE.github, b = board() || {};
  const all = boardItems().length, open = openItems().length;
  const recent = g.repos.slice().sort((a, c) => (c.updatedAt || "").localeCompare(a.updatedAt || "")).slice(0, 7);
  const proj = (j.projects || [])[0] || {};
  document.getElementById("side").innerHTML = `
    <div class="head"><b>GodJIRA</b><span class="grow"></span>
      <button class="ghost" title="hämta färskt" data-act="refresh">↻</button></div>
    <div class="item ${view === "overview" ? "on" : ""}" data-v="overview"><span class="g">◫</span>Översikt</div>
    <div class="item ${view === "items" ? "on" : ""}" data-v="items"><span class="g">☰</span>${TEXT.allTasks}<span class="c">${all + ghItems().length}</span></div>
    <div class="sect">Jira</div>
    <div class="item" data-v="items"><span class="g">◆</span>${esc(proj.key || "Jira")}<span class="c">${all}</span></div>
    <div class="sub">
      <div class="item ${view === "board" ? "on" : ""}" data-v="board"><span class="g">▤</span>${esc(b.name || "Tavlan")}<span class="c">${open}</span></div>
      <div class="item" data-v="board"><span class="g">↓</span>Backlog<span class="c">${backlog().length}</span></div>
      <div class="item" data-v="items"><span class="g">✓</span>Klara<span class="c">${all - open}</span></div>
    </div>
    <div class="sect">GitHub</div>
    <div class="item ${view === "repos" ? "on" : ""}" data-v="repos"><span class="g">⌥</span>${esc(g.login || "GitHub")}<span class="c">${g.repos.length}</span></div>
    <div class="sub">${recent.map(r => `<div class="item" data-v="repos"><span class="g">${r.isPrivate ? "▣" : "▢"}</span>${esc(r.name)}</div>`).join("")}</div>
    <div class="who">${esc((j.account || {}).displayName || "")}<br>
      <span class="key">${esc((j.account || {}).email || "")}</span><br>${esc(j.mode || "")} · uppdaterad ${hhmm()}</div>`;
}

function renderCrumbs() {
  const j = STATE.jira, g = STATE.github, b = board() || {};
  const c = {
    overview: ["GodJIRA", "Översikt", ""],
    board: ["Jira", b.name || "Tavlan", ""],
    items: ["GodJIRA", TEXT.allTasks, boardItems().length + ghItems().length + " st"],
    repos: ["GitHub", g.login || "GitHub", g.repos.length + " " + TEXT.repos],
  }[view];
  document.getElementById("crumbs").innerHTML =
    `<span class="muted">${esc(c[0])}</span><span class="sep">›</span><b>${esc(c[1])}</b>` +
    (c[2] ? `<span class="sep">·</span><span class="muted">${esc(c[2])}</span>` : "") +
    (j.ok ? "" : ` <span class="err">jira: ${esc(j.error || "inget svar")}</span>`) +
    (g.ok ? "" : ` <span class="err">github: ${esc(g.error || "inget svar")}</span>`);
  document.getElementById("seg").innerHTML = Object.entries(TEXT.views).map(([v, [label, glyph]]) =>
    `<button data-v="${v}" class="${v === view ? "on" : ""}" title="${label}">${glyph}</button>`).join("");
}

function renderStats() {
  const g = STATE.github, f = STATE.flow;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${openItems().length}</div><div class="l">öppna i Jira</div>
      <div class="x">${TEXT.settled}: ${issues().length} · ${TEXT.backlog}: ${backlog().length}</div></div>
    <div class="stat"><div class="n">${g.pullRequests.length + g.issues.length}</div><div class="l">${TEXT.waiting} på GitHub</div>
      <div class="x">${g.pullRequests.length} PR · ${g.issues.length} ärenden</div></div>
    <div class="stat"><div class="n">${g.repos.length}</div><div class="l">${TEXT.repos}</div>
      <div class="x">${g.repos.filter(r => r.isPrivate).length} privata · ${g.repos.filter(r => !r.isPrivate).length} publika</div></div>
    <div class="stat"><div class="n">${f.pick ? esc(f.pick.key) : "—"}</div><div class="l">flödets nästa</div>
      <div class="x">${esc(f.pick ? (f.pick.summary || "").slice(0, 40) : (f.error || TEXT.nothing))}</div></div>`;
}

function renderFlowPick() {
  const f = STATE.flow, p = f.pick, host = document.getElementById("flowPick");
  if (!p) { host.innerHTML = `<div class="empty">${TEXT.noNext || "inget att ta just nu"}${f.error ? " · " + esc(f.error) : ""}</div>`; return; }
  host.innerHTML = `
    <div class="card" style="border-left:2px solid var(--blue)">
      <div class="c1">${typeGlyph("Task")}<span class="key">${esc(p.key)}</span><span class="grow"></span>${prio(p.priority)}</div>
      <div class="t">${esc(p.summary)}</div>
      <div class="c2"><span class="pill">${stateDot("new")}${esc(p.status || "")}</span>
        ${p.assignee ? `<span class="pill">${avatar(p.assignee, true)}${esc(p.assignee)}</span>` : `<span class="pill">oassignerat</span>`}</div>
    </div>
    ${f.someoneElses ? `<div class="empty" style="margin-top:9px"><span class="key">${esc(f.someoneElses.key)}</span> ${TEXT.someoneElses}</div>` : ""}
    ${(f.runnersUp || []).length ? `<div class="wl" style="margin-top:10px"><div class="empty">${TEXT.runnersUp}</div>
      ${f.runnersUp.map(i => `<div class="r">${typeGlyph("Task")}<span class="key">${esc(i.key)}</span>
        <span class="t">${esc(i.summary)}</span><span class="tside">${esc(i.priority || "")}</span></div>`).join("")}</div>` : ""}`;
}

function renderJournal() {
  const log = (STATE.journal.log || []).slice(0, 9);
  document.getElementById("journal").innerHTML = log.length
    ? log.map(e => `<div class="r">
        <span class="muted" style="width:34px">${esc((e.at || "").slice(11, 16))}</span>
        ${e.key ? `<span class="key">${esc(e.key)}</span>` : ""}
        <span class="t">${esc(e.action || "")}${e.detail ? " · " + esc(e.detail) : ""}</span>
        <span class="tside">${e.mode ? esc(e.mode) : ""} ${e.ok ? "✓" : `<span class="err">✗</span>`}</span></div>`).join("")
    : `<div class="empty">${esc(STATE.journal.error || "inget skrivet ännu")}</div>`;
}

function renderRecent() {
  const g = STATE.github;
  document.getElementById("recentMeta").textContent = "senast rörda först";
  document.getElementById("recent").innerHTML = g.repos.slice()
    .sort((a, c) => (c.updatedAt || "").localeCompare(a.updatedAt || "")).slice(0, 8)
    .map(r => `<div class="r"><span class="g typeg" style="color:${r.isPrivate ? "var(--amber)" : "var(--green)"}">${r.isPrivate ? "▣" : "▢"}</span>
      <span class="t"><b>${esc(r.name)}</b> <span class="muted">${esc(r.description || (r.primaryLanguage && r.primaryLanguage.name) || "")}</span></span>
      <span class="tside">${esc((r.primaryLanguage && r.primaryLanguage.name) || "—")} · ${ago(r.updatedAt)}</span></div>`).join("");
}

function card(i) {
  const body = `
    <div class="c1">${typeGlyph(i.typeName)}<span class="key">${esc(i.key)}</span>
      <span class="grow"></span>${i.assigneeName ? avatar(i.assigneeName, true) : ""}</div>
    <div class="t">${esc(i.summary)}</div>
    <div class="c2">${prio(i.priorityName)}
      ${i.statusName ? `<span class="pill">${stateDot(i.statusCategory)}${esc(i.statusName)}</span>` : ""}
      ${i.dueMs ? `<span class="pill">📅 ${dt(i.dueMs)}</span>` : ""}
      ${i.storyPoints ? `<span class="pill">${i.storyPoints} p</span>` : ""}
      ${i.sprintName ? `<span class="pill">${esc(i.sprintName)}</span>` : ""}
      ${i.parentKey ? `<span class="pill">↳ ${esc(i.parentKey)}</span>` : ""}</div>`;
  return link(i.url, `<div class="card">${body}</div>`);
}

function renderBoard() {
  const b = board();
  if (!b) { document.getElementById("cols").innerHTML = `<div class="empty err">${esc(STATE.jira.error || "ingen tavla")}</div>`; return; }
  document.getElementById("sprintNote").textContent = b.sprint ? "aktiv sprint: " + b.sprint.name : TEXT.noSprint;
  const byStatus = {};
  boardItems().forEach(i => (byStatus[i.statusId] = byStatus[i.statusId] || []).push(i));
  document.getElementById("cols").innerHTML = (b.columns || []).map(c => {
    const list = (byStatus[c.statusId] || []).filter(matches), shown = list.slice(0, 60);
    const cat = list.length ? list[0].statusCategory : "new";
    return `<div class="bcol"><h3>${stateDot(cat)}${esc(c.name)}<span class="c">${list.length}</span></h3>
      <div class="stack">${shown.map(card).join("") || `<div class="empty">${TEXT.empty}</div>`}
      ${list.length > shown.length ? `<div class="empty">+${list.length - shown.length} äldre</div>` : ""}</div></div>`;
  }).join("");
}

function renderItems() {
  const rows = boardItems().map(i => ({ ...i, source: "JIRA", when: new Date(i.updatedMs || 0).toISOString() }))
    .concat(ghItems()).filter(matches)
    .sort((a, c) => (Date.parse(c.when) || 0) - (Date.parse(a.when) || 0));
  document.getElementById("itemsTable").innerHTML =
    `<thead><tr><th style="width:60px">Källa</th><th style="width:152px">ID</th><th>Titel</th>
       <th style="width:150px">Status</th><th style="width:60px">Prio</th><th style="width:64px">Ansvarig</th>
       <th style="width:130px">Sprint</th><th style="width:80px">Rörd</th></tr></thead>
     <tbody>${rows.map(i => `<tr>
       <td><span class="src">${i.source}</span></td>
       <td>${link(i.url, typeGlyph(i.typeName) + ` <span class="key">${esc(i.key)}</span>`)}</td>
       <td>${link(i.url, `<span class="t">${esc(i.summary)}</span>`)}</td>
       <td>${i.statusName ? `<span class="pill">${stateDot(i.statusCategory)}${esc(i.statusName)}</span>` : ""}</td>
       <td>${prio(i.priorityName)}</td>
       <td>${i.assigneeName ? avatar(i.assigneeName, true) : ""}</td>
       <td class="muted">${esc(i.sprintName || "")}</td>
       <td class="muted">${i.when ? ago(i.when) : ""}</td></tr>`).join("")
       || `<tr><td colspan="8" class="empty">${TEXT.empty}</td></tr>`}</tbody>`;
}

function renderRepos() {
  const g = STATE.github;
  const prBy = {}, issBy = {};
  g.pullRequests.forEach(p => (prBy[p.repository.name] = prBy[p.repository.name] || []).push(p));
  g.issues.forEach(i => (issBy[i.repository.name] = issBy[i.repository.name] || []).push(i));
  const rows = g.repos.filter(r => matches({ key: r.name, summary: r.description }))
    .sort((a, c) => (c.updatedAt || "").localeCompare(a.updatedAt || ""));
  document.getElementById("repoTable").innerHTML =
    `<thead><tr><th>Repo</th><th style="width:104px">Synlighet</th><th style="width:110px">Språk</th>
      <th style="width:56px" class="num">★</th><th style="width:56px" class="num">PR</th>
      <th style="width:76px" class="num">Ärenden</th><th style="width:80px">Senast</th></tr></thead>
     <tbody>${rows.map(r => `<tr>
       <td><b>${esc(r.name)}</b>${r.description ? `<div class="muted" style="font-size:11.5px;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.description)}</div>` : ""}</td>
       <td><span class="pill">${r.isPrivate ? "▣ privat" : "▢ publikt"}</span></td>
       <td class="muted">${esc((r.primaryLanguage && r.primaryLanguage.name) || "—")}</td>
       <td class="num">${r.stargazerCount || 0}</td>
       <td class="num">${(prBy[r.name] || []).length}</td>
       <td class="num">${(issBy[r.name] || []).length}</td>
       <td class="muted">${ago(r.updatedAt)}</td></tr>`).join("")}</tbody>`;
  const ghList = items => items.map(x => `<div class="r">${link(x.url,
      `<span class="key">${esc(x.repository.nameWithOwner || x.repository.name)}#${x.number}</span>`)}
      <span class="t">${link(x.url, esc(x.title))}</span><span class="tside">${ago(x.updatedAt)}</span></div>`).join("")
    || `<div class="empty">inga öppna</div>`;
  document.getElementById("prMeta").textContent = g.pullRequests.length + "";
  document.getElementById("issMeta").textContent = g.issues.length + "";
  document.getElementById("prs").innerHTML = ghList(g.pullRequests);
  document.getElementById("issues").innerHTML = ghList(g.issues);
}

function render() {
  if (!STATE) return;
  renderRail(); renderSide(); renderCrumbs();
  document.getElementById("filter").hidden = !(view === "items" || view === "repos");
  if (view === "overview") { renderStats(); renderFlowPick(); renderJournal(); renderRecent(); }
  if (view === "board") renderBoard();
  if (view === "items") renderItems();
  if (view === "repos") renderRepos();
}

async function load(refresh) {
  try {
    const r = await fetch(refresh ? "/api/refresh" : "/api/state", { cache: "no-store" });
    STATE = await r.json(); render();
  } catch (e) {
    document.getElementById("crumbs").innerHTML = `<span class="err">ingen kontakt med panelen på :8788</span>`;
  }
}

function show(v) {
  view = TEXT.views[v] ? v : "board";
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.id === "v-" + view));
  location.hash = view;
  render();
}
document.addEventListener("click", e => {
  if (e.target.closest('[data-act="refresh"]')) return load(true);
  const t = e.target.closest("[data-v]"); if (!t) return;
  e.preventDefault(); show(t.dataset.v);
});
document.getElementById("refresh").addEventListener("click", () => load(true));
document.getElementById("filter").addEventListener("input", render);
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show((location.hash || "").slice(1) || "board");
load(false);
setInterval(() => load(false), 60000);
</script>
</body>
</html>
