<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/godjira.svg">
<title>GodJIRA</title>
<style>
  /* Plane's anatomy, our data: icon rail + nav sidebar, breadcrumb header with a
     view switcher, columns with a state icon and a count, work-item cards with
     type glyph, id, title, then one property row (priority bars, state pill,
     due date) and avatars, plus a table of every work item across both sources.
     No writes: the panel reads the same CLI the flow uses, and never decides. */
  :root {
    --bg: #0b0b0e; --rail: #08080a; --side: #101014; --panel: #16161b;
    --card: #1b1b21; --card-hi: #212128; --line: #26262e; --line-2: #33333d;
    --text: #ececf1; --text-2: #a5a5b3; --muted: #71717f;
    --blue: #4d7cfe; --amber: #e0a33e; --red: #e5545f; --green: #48b98a; --violet: #9b7bf0;
    --r: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text); display: flex; height: 100vh;
    font: 13.5px/1.45 ui-sans-serif, system-ui, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  .col { display: flex; flex-direction: column; }
  /* Loading screen. Shown by the markup alone, so it is up before the first fetch and
     nobody has to guess whether the app is working. It also carries the failure: a
     spinner that never stops is how a dead backend looks like a broken app. */
  .splash {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: grid; place-items: center; transition: opacity .35s ease;
  }
  .splash.gone { opacity: 0; pointer-events: none; }
  .splash-box { display: flex; flex-direction: column; align-items: center; gap: 11px; text-align: center; }
  .splash-box b { font-size: 15px; letter-spacing: .02em; }
  .splash .note { color: var(--text-2); font-size: 12.5px; max-width: 330px; }
  .spin {
    width: 18px; height: 18px; border: 2px solid var(--line-2); border-top-color: var(--blue);
    border-radius: 50%; animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Märket ligger i assets/godjira.svg (beskuret från A4-sidan i originalet: motivet
     låg utanför sin egen viewBox och syntes inte alls förrän det beskars). */
  .logo { height: 68px; width: auto; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .key { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  /* --------------------------------------------------------- import ---- */
  .impfile { cursor: pointer; }
  .impitem { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); }
  .impitem:first-child { border-top: 0; }
  .impitem input[type=checkbox] { margin-top: 3px; flex: 0 0 auto; }
  .impitem .t2 { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .impbar { display: flex; align-items: center; gap: 8px; padding-top: 10px; margin-top: 6px; border-top: 1px solid var(--line); }
  #impWish { width: 100%; resize: vertical; background: var(--panel); color: var(--text);
             border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
  #impNote.err { color: var(--red); }
  #impNote.warn { color: var(--amber, #e0a33e); }
  .empty { color: var(--text-2); font-size: 12.5px; padding: 3px 0; }
  .err { color: var(--red); }

  /* ------------------------------------------------------------ icon rail */
  .rail {
    width: 58px; flex: 0 0 58px; background: var(--rail); border-right: 1px solid var(--line);
    align-items: center; gap: 12px; padding: 12px 0; height: 100%;
  }
  .rail .mark {
    width: 34px; height: 30px; border-radius: 9px;
    /* bara odjuret: motivet är 76 % av höjden, ordmärket de sista 21 procenten.
       Rita om logotypen -> räkna om 39px (30 / 0,7625). ponytail: ett fast mått,
       blir logotypen en annan form får det bli en egen ikonfil i stället. */
    background: var(--panel) url(/godjira.svg) center top / auto 39px no-repeat;
  }
  .railitem {
    width: 46px; display: grid; place-items: center; gap: 3px; padding: 6px 0; border-radius: 8px;
    color: var(--muted); cursor: pointer; font-size: 9px; letter-spacing: .04em; text-transform: uppercase;
  }
  .railitem .g { font-size: 15px; line-height: 1; }
  .railitem:hover { background: var(--panel); color: var(--text-2); }
  .railitem.on { background: var(--panel); color: var(--text); }
  .railitem.on .g { color: var(--blue); }

  /* -------------------------------------------------------------- sidebar */
  .side {
    width: 248px; flex: 0 0 248px; background: var(--side); border-right: 1px solid var(--line);
    /* No scroller of its own: the sidebar is navigation and stays put. At a very
       short window (under ~500 px) the bottom of it clips -- the fix then is to put
       overflow-y: auto back here, not to move the nav into the main pane. */
    padding: 12px 10px; gap: 3px; height: 100%; overflow: hidden;
  }
  .side .head { display: flex; align-items: center; gap: 8px; padding: 2px 6px 10px; }
  .side .head b { font-size: 14.5px; font-weight: 600; }
  .ghost {
    background: transparent; border: 1px solid var(--line-2); color: var(--text-2);
    border-radius: var(--r); padding: 3px 8px; font-size: 12px; cursor: pointer;
  }
  .ghost:hover { border-color: #4a4a58; color: var(--text); }
  .item {
    display: flex; align-items: center; gap: 9px; padding: 6.5px 9px; border-radius: var(--r);
    color: var(--text-2); cursor: pointer; font-size: 13px;
  }
  .item .g { width: 15px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .item:hover { background: var(--panel); color: var(--text); }
  .item.on { background: var(--card-hi); color: var(--text); }
  .item .c { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .sect { margin: 14px 0 4px; padding: 0 9px; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .sub { margin-left: 12px; border-left: 1px solid var(--line); padding-left: 6px; }
  .who { margin-top: auto; padding: 10px 8px 2px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }

  /* ----------------------------------------------------------------- main */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
  header.top {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line);
    background: var(--bg); position: sticky; top: 0; z-index: 5;
  }
  .crumbs { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .crumbs .sep { color: var(--muted); }
  .crumbs b { font-weight: 600; }
  .seg { display: flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
  .seg button { background: transparent; border: 0; color: var(--muted); padding: 4px 9px; cursor: pointer; font-size: 13px; }
  .seg button:hover { color: var(--text); background: var(--panel); }
  .seg button.on { background: var(--card-hi); color: var(--text); }
  .filters { display: flex; align-items: center; gap: 4px; }
  .chip {
    border: 1px solid var(--line-2); background: transparent; color: var(--text-2);
    border-radius: 999px; padding: 2px 9px; font-size: 11.5px; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { color: var(--text); border-color: #4a4a58; }
  .chip.on { background: var(--card-hi); color: var(--text); border-color: #4a4a58; }
  .chip.sep { border: 0; color: var(--line-2); padding: 0 2px; cursor: default; }
  .chip .c { color: var(--muted); margin-left: 4px; }
  input[type="search"] {
    background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r); color: var(--text);
    padding: 5px 10px; font: inherit; font-size: 12.5px; min-width: 200px;
  }
  .wrap { padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 16px; }
  .view { display: none; flex-direction: column; gap: 16px; }
  .view.on { display: flex; }

  /* -------------------------------------------------------------- overview */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 13px; }
  .stat .n { font-size: 23px; font-weight: 600; letter-spacing: -.01em; }
  .stat .l { color: var(--text-2); font-size: 12px; }
  .stat .x { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  .two { display: grid; grid-template-columns: 1.05fr .95fr; gap: 16px; align-items: start; }
  @media (max-width: 1080px) { .two { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .panel > h3 {
    margin: 0; padding: 10px 13px; border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .panel > h3 .meta { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 11px; }
  .panel .body { padding: 12px 13px; }
  .wl .r { display: flex; align-items: center; gap: 9px; padding: 7px 2px; border-bottom: 1px solid var(--line); }
  .wl .r:last-child { border-bottom: 0; }
  .wl .r .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wl .r .tside { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }

  /* ----------------------------------------------------------------- board */
  .cols { display: flex; flex-direction: column; gap: 20px; }
  .bcol > summary {
    margin: 0 0 9px; padding: 0 4px; display: flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600; cursor: pointer; list-style: none;
  }
  .bcol > summary::-webkit-details-marker { display: none; }
  .bcol > summary::before { content: "▾"; color: var(--muted); font-size: 10px; }
  .bcol:not([open]) > summary { margin-bottom: 0; }
  .bcol:not([open]) > summary::before { content: "▸"; }
  .bcol > summary .c { color: var(--muted); font-weight: 400; font-size: 12px; }
  /* fr-rows: every row is as tall as the tallest card, so the grid reads as a board
     instead of a ragged wall. The card fills its row and keeps its metadata at the
     bottom, which is what makes two rows of unequal titles still line up. */
  .bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: 8px; padding: 1px; grid-auto-rows: 1fr; }
  .bgrid > a { display: block; height: 100%; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px;
    height: 100%; display: flex; flex-direction: column;
  }
  .card:hover { background: var(--card-hi); border-color: var(--line-2); }
  .card .c1 { display: flex; align-items: center; gap: 7px; }
  .card .t {
    margin: 5px 0 9px; font-size: 13px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .c2 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; margin-top: auto; }
  .typeg { font-size: 12px; line-height: 1; }

  .avatar {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-size: 10px; font-weight: 600; color: #0b0b0e; flex: 0 0 22px;
  }
  .avatar.sm { width: 20px; height: 20px; flex-basis: 20px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 1.5px 7px; border: 1px solid var(--line-2);
    border-radius: 5px; font-size: 11.5px; color: var(--text-2); background: #ffffff08;
    white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: 0 0 7px; }
  .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; }
  .bars i { width: 2.5px; border-radius: 1px; background: var(--line-2); display: block; }
  .bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 7px; } .bars i:nth-child(3) { height: 10px; }
  .bars.p3 i { background: var(--red); }
  .bars.p2 i:nth-child(-n+2) { background: var(--amber); }
  .bars.p1 i:nth-child(1) { background: var(--blue); }
  .excl {
    display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 4px;
    background: #e5545f22; color: var(--red); font-size: 10px; font-weight: 700;
  }
  .cardflag { font-size: 11px; color: var(--amber); }

  /* ----------------------------------------------------------------- table */
  .tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  /* Fixed layout so the header widths hold: a long sprint name clips in its cell
     instead of wrapping and stretching one row taller than its neighbours. */
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td, td .muted { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.muted { color: var(--text-2); }
  th {
    color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    background: var(--panel);
  }
  tr:hover td { background: #ffffff06; }
  td .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 460px; }
  td.num { text-align: right; color: var(--muted); }
  .src { font-size: 10px; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="splash-box">
    <img class="logo" src="/godjira.svg" alt="GodJIRA" height="68">
    <div class="spin"></div>
    <div class="note" id="splashNote">hämtar Jira, GitHub och flödets nästa …</div>
  </div>
</div>

<nav class="rail col" id="rail"></nav>
<aside class="side col" id="side"></aside>

<main>
  <header class="top">
    <div class="crumbs" id="crumbs"></div>
    <span class="grow"></span>
    <div class="seg" id="seg"></div>
    <div class="filters" id="filters"></div>
    <input type="search" id="filter" placeholder="filtrera">
    <button class="ghost" id="refresh">Uppdatera</button>
  </header>

  <div class="wrap">
    <section class="view on" id="v-overview">
      <div class="stats" id="stats"></div>
      <div class="two">
        <div class="panel">
          <h3>Flödets nästa <span class="meta">jira_flow.py next --dry-run</span></h3>
          <div class="body" id="flowPick"></div>
        </div>
        <div class="panel">
          <h3>Flödets egna skrivningar <span class="meta">journal</span></h3>
          <div class="body" id="journal"></div>
        </div>
      </div>
      <div class="panel">
        <h3>Senast rörda repon <span class="meta" id="recentMeta"></span></h3>
        <div class="body" id="recent"></div>
      </div>
    </section>

    <section class="view" id="v-board">
      <div class="empty" id="sprintNote"></div>
      <div class="cols" id="cols"></div>
    </section>

    <section class="view" id="v-items">
      <div class="tablewrap"><table id="itemsTable"></table></div>
    </section>

    <section class="view" id="v-import">
      <div class="panel">
        <h3>Underlag in, ärenden ut <span class="meta">pdf, docx, odt, xlsx, pptx eller text</span></h3>
        <div class="body">
          <textarea id="impWish" rows="3"
            placeholder="Vad ska bli ärenden? Lämna tomt för att utgå från dokumenten."></textarea>
          <div class="improw">
            <label class="chip impfile"><input type="file" id="impFiles" multiple hidden accept=".pdf,.docx,.odt,.xlsx,.pptx,.txt,.md,.csv,.json,.xml,.rst,.log,.html,.htm">välj filer</label>
            <span class="meta" id="impFiles">inga filer valda</span>
            <span class="grow"></span>
            <button class="chip" data-act="imp-parse" id="impParse">Tolka → förslag</button>
          </div>
          <div class="meta" id="impNote"></div>
        </div>
      </div>
      <div class="panel" id="impProposalPanel" hidden>
        <h3>Förslag <span class="meta" id="impProposalMeta"></span></h3>
        <div class="body" id="impProposal"></div>
      </div>
      <div class="panel" id="impDonePanel" hidden>
        <h3>Skapade ärenden <span class="meta" id="impDoneMeta"></span></h3>
        <div class="body wl" id="impDone"></div>
      </div>
    </section>

    <section class="view" id="v-repos">
      <div class="tablewrap"><table id="repoTable"></table></div>
      <div class="two">
        <div class="panel">
          <h3>Öppna pull requests <span class="meta" id="prMeta"></span></h3>
          <div class="body wl" id="prs"></div>
        </div>
        <div class="panel">
          <h3>Öppna ärenden <span class="meta" id="issMeta"></span></h3>
          <div class="body wl" id="issues"></div>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
const TEXT = {
  views: { overview: ["Översikt", "◫"], board: ["Tavlan", "▤"], items: ["Uppgifter", "☰"], repos: ["Repon", "⌥"],
           import: ["Importera", "⇪"] },
  next: "nästa", empty: "Inga ärenden", never: "aldrig", nothing: "inget",
  someoneElses: "är någon annans — tas från panelens andra tryck",
  runnersUp: "därefter", noSprint: "ingen aktiv sprint — det som är kvar står i backloggen och ligger i To Do här",
  open: "öppna", settled: "klara", backlog: "i backloggen", repos: "repon", waiting: "väntar på dig",
  allTasks: "Alla uppgifter", sources: "Jira + GitHub",
  scope: { all: "Alla", shared: "Gemensamma", mine: "Egna" },
  none: "utan",
};
let STATE = null, view = "board";
// Same rule as jira_flow.py (SHARED_PREFIX): a shared task is marked in the summary.
const SHARED_PREFIX = "GEMENSAMT";
const isShared = i => String(i.summary || "").trim().toUpperCase().startsWith(SHARED_PREFIX);
const RANK = { highest: 0, high: 1, medium: 2, low: 3 };
const F = { scope: "all", prio: new Set() };   // prio empty = no priority filter at all

/* ---------------------------------------------------------------- bitar --- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(iso) {
  const t = new Date(iso).getTime(); if (!t) return TEXT.never;
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "nyss"; if (m < 60) return m + " min";
  const h = Math.round(m / 60); if (h < 24) return h + " h"; return Math.round(h / 24) + " d";
}
const MON = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const dt = ms => { if (!ms) return ""; const d = new Date(ms); return d.getDate() + " " + MON[d.getMonth()]; };
const hhmm = () => new Date().toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });

// Plane's type icon: one glyph per work-item type, coloured by type.
const TYPE = [["epic", "◆", "#9b7bf0"], ["story", "▣", "#48b98a"], ["task", "▤", "#4d7cfe"],
              ["bug", "●", "#e5545f"], ["subtask", "↳", "#71717f"]];
function typeGlyph(name) {
  const k = String(name || "").toLowerCase();
  const hit = TYPE.find(([key]) => k.includes(key)) || ["", "▫", "#a5a5b3"];
  return `<span class="typeg" style="color:${hit[2]}" title="${esc(name || "")}">${hit[1]}</span>`;
}
// Plane's state icon: hollow for new, amber for in-flight, green for done.
function stateDot(cat) {
  const c = cat === "done" ? "var(--green)" : cat === "indeterminate" ? "var(--amber)" : "var(--muted)";
  return `<span class="dot" style="background:${c}"></span>`;
}
// Plane's priority icon: signal bars for High/Medium/Low, a red box for Highest/Urgent.
function prio(name) {
  const p = String(name || "").toLowerCase();
  const t = `title="${esc(name)}"`;
  if (p.startsWith("highest") || p.includes("urgent")) return `<span class="excl" ${t}>!</span>`;
  if (p.startsWith("high")) return `<span class="bars p3" ${t}><i></i><i></i><i></i></span>`;
  if (p.startsWith("med")) return `<span class="bars p2" ${t}><i></i><i></i><i></i></span>`;
  if (p.startsWith("low")) return `<span class="bars p1" ${t}><i></i><i></i><i></i></span>`;
  return "";
}
const HUE = ["#4d7cfe", "#48b98a", "#e0a33e", "#9b7bf0", "#e5545f", "#3fb6c9"];
function avatar(name, small) {
  if (!name) return "";
  const h = [...name].reduce((a, c) => a + c.charCodeAt(0), 0);
  const ini = name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  return `<span class="avatar${small ? " sm" : ""}" style="background:${HUE[h % HUE.length]}" title="${esc(name)}">${esc(ini)}</span>`;
}

/* --------------------------------------------------------------- data ---- */
const board = () => (STATE.jira.boards || [])[0] || null;
const issues = () => (board() || {}).issues || [];
const backlog = () => (board() || {}).backlog || [];
// The board endpoint keeps the settled work and the backlog keeps the live work
// (no active sprint). Same keys never appear in both -- measured 0 of 93+38 -- so
// the board is shown the way the flow sees it.
function boardItems() {
  const seen = new Set();
  return issues().concat(backlog()).filter(i => !seen.has(i.key) && seen.add(i.key));
}
const openItems = () => boardItems().filter(i => i.statusCategory !== "done");
// GitHub's open work shaped as work items, so one table can hold both sources.
function ghItems() {
  const g = STATE.github, out = [];
  g.pullRequests.forEach(p => out.push({
    source: "GH", key: `${p.repository.nameWithOwner || p.repository.name}#${p.number}`,
    summary: p.title, url: p.url, typeName: p.isDraft ? "Draft" : "Pull request",
    statusName: p.isDraft ? "Draft" : "Open", statusCategory: "indeterminate", when: p.updatedAt,
  }));
  g.issues.forEach(i => out.push({
    source: "GH", key: `${i.repository.nameWithOwner || i.repository.name}#${i.number}`,
    summary: i.title, url: i.url, typeName: "Issue", statusName: "Open",
    statusCategory: "indeterminate", when: i.updatedAt,
  }));
  return out;
}
const textOk = x => {
  const q = (document.getElementById("filter").value || "").toLowerCase();
  return !q || (x.key + " " + (x.summary || "") + " " + (x.assigneeName || "")).toLowerCase().includes(q);
};
const scopeOk = (x, v) => v === "all" || isShared(x) === (v === "shared");
// GitHub rows carry no Jira priority, so they fall under "utan" rather than sneaking
// past a severity choice -- a filter that quietly ignores half the table is a lie.
const prioOk = x => !F.prio.size || F.prio.has(x.priorityName || "utan");
const matches = x => textOk(x) && scopeOk(x, F.scope) && prioOk(x);
// Built from the data, so a priority Alex adds in Jira shows up without a code change.
function priorities() {
  const seen = new Map();
  boardItems().concat(ghItems()).forEach(x => {
    const name = x.priorityName || "";
    if (name && !seen.has(name)) seen.set(name, RANK[name.toLowerCase()] ?? 9);
  });
  return [...seen.keys()].sort((a, c) => seen.get(a) - seen.get(c));
}

}

// A document in, a proposal out, and nothing written to Jira until a human has
// ticked off what should be there. The panel sends back only *which* of the
// proposed items to write -- never issue text of its own.
const IMP = { files: [], plan: [], token: "", spent: false, keep: new Set(), busy: false,
              note: "", bad: false, created: [] };
const projectKey = () => (board() || {}).projectKey || "SCRUM";
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const jiraMode = () => (STATE && STATE.jira.mode === "real" ? "skarpt läge" : "provläge");
// The key as a link to Jira, when one of the board's own issues tells us the site.
function jiraOrigin() {
  try { return new URL((issues()[0] || {}).url || "").origin; } catch { return ""; }
}
function b64(buffer) {   // chunked: one spread over a big file overflows the stack
  const bytes = new Uint8Array(buffer); let out = "";
  for (let i = 0; i < bytes.length; i += 8192) out += String.fromCharCode(...bytes.subarray(i, i + 8192));
  return btoa(out);
}
const filesLabel = () => IMP.files.length
  ? IMP.files.map(f => `${f.name} (${Math.max(1, Math.round(f.size / 1024))} kB)`).join(", ")
  : "inga filer valda";

// The wish box is deliberately not re-rendered: a refresh every 60 s must not eat
// what Alex is in the middle of typing.
function renderImport() {
  document.getElementById("impFiles").textContent = filesLabel();
  const note = document.getElementById("impNote");

  parse.disabled = IMP.busy || !IMP.files.length;
  parse.textContent = IMP.busy ? "tolkar …" : "Tolka → förslag";

  const host = document.getElementById("impProposal");
  document.getElementById("impProposalPanel").hidden = !IMP.plan.length;
  if (IMP.plan.length) {
    document.getElementById("impProposalMeta").textContent =
      `${IMP.plan.length} förslag · ${plural(IMP.keep.size, "ibockad", "ibockade")} · ingenting skrivet än`;
    host.innerHTML = IMP.plan.map((item, i) => `
      <label class="impitem">
        <input type="checkbox" data-keep="${i}" ${IMP.keep.has(i) ? "checked" : ""}>
        <span><span class="key">${esc(item.type || "Task")}</span> ${esc(item.summary || "")}
          ${item.priority ? `<span class="meta">${esc(item.priority)}</span>` : ""}

        </span>
      </label>`).join("") + `
      <div class="impbar">
        <button class="chip" data-act="imp-all">bocka alla</button>
        <button class="chip" data-act="imp-none">bocka av alla</button>
        <span class="grow"></span>
        <button class="chip on" data-act="imp-apply" ${IMP.keep.size && !IMP.busy && !IMP.spent ? "" : "disabled"}>
          Skapa ${plural(IMP.keep.size, "ärende", "ärenden")} i ${esc(projectKey())} (${jiraMode()})
        </button>
      </div>`;
  }

  const done = document.getElementById("impDonePanel");
  done.hidden = !IMP.created.length;
  if (IMP.created.length) {
    document.getElementById("impDoneMeta").textContent = IMP.created.length + " skrivna i " + projectKey();
    document.getElementById("impDone").innerHTML = IMP.created.map(c => `<div class="r">` +
      link(jiraOrigin() ? `${jiraOrigin()}/browse/${c.key}` : "",
           `<span class="key">${esc(c.key || "")}</span> <span class="t">${esc(c.summary || "")}</span>`) +
      `</div>`).join("");

}

async function impParse() {
  const wish = document.getElementById("impWish").value.trim();
  if (!IMP.files.length || IMP.busy) return;
  IMP.busy = true; IMP.bad = false; IMP.plan = []; IMP.token = ""; IMP.spent = false;
  IMP.note = "tolkar underlaget — det tar några sekunder"; renderImport();
  try {
    const files = [];
    for (const f of IMP.files) files.push({ name: f.name, b64: b64(await f.arrayBuffer()) });
    const r = await fetch("/api/import", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wish, files }) });
    const answer = await r.json();
    if (!answer.ok) throw new Error(answer.error || "svaret gick inte att läsa");
    IMP.plan = answer.proposal || []; IMP.token = answer.token || "";
    IMP.keep = new Set(IMP.plan.map((_, i) => i));
    IMP.note = `${IMP.plan.length} förslag ur ${IMP.files.length} dokument — bocka av det du inte vill ha`;
  } catch (e) {
    IMP.bad = true; IMP.note = "kunde inte tolka: " + e.message;
  } finally { IMP.busy = false; renderImport(); }
}

async function impApply() {
  const keep = [...IMP.keep].sort((a, b) => a - b);
  if (!keep.length || IMP.busy || IMP.spent) return;
  const project = projectKey();
  if (!window.confirm(`Skapa ${plural(keep.length, "ärende", "ärenden")} i ${project} (${jiraMode()})?`)) return;
  IMP.busy = true; IMP.note = `skriver ${keep.length} ärenden i ${project} …`; renderImport();
  try {
    const r = await fetch("/api/import/apply", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: IMP.token, keep }) });
    const answer = await r.json();
    IMP.created = answer.created || [];
    IMP.spent = true;                       // one approval, used once -- also when it failed
    if (answer.ok) {
      IMP.plan = []; IMP.keep = new Set();
      IMP.bad = false; IMP.note = `${plural(IMP.created.length, "ärende", "ärenden")} skapade i ${project}`;
      load(false);                          // the board changed: read it again
    } else {
      IMP.bad = true;
      IMP.note = `stannade efter ${IMP.created.length} av ${keep.length}: ${answer.error || "okänt fel"}`;
    }
  } catch (e) { IMP.bad = true; IMP.note = "kunde inte skriva: " + e.message; }
  finally { IMP.busy = false; renderImport(); }
}

  if (view === "board") renderBoard();

  if (view === "repos") renderRepos();
  if (view === "import") renderImport();
}

async function load(refresh) {
  let next;
  try {
    const r = await fetch(refresh ? "/api/refresh" : "/api/state", { cache: "no-store" });
    next = await r.json();
  } catch (e) {
    document.getElementById("crumbs").innerHTML = `<span class="err">ingen kontakt med panelen på :8788</span>`;
    return splashFail("ingen kontakt med panelen på :8788");
  }
  if (!refresh && STATE && next.generatedAt === STATE.generatedAt) return;   // same answer, leave the page alone
  STATE = next;
  try {
    render();
  } catch (e) {
    // Ett fel i ritningen är inte ett nätverksfel -- och splash-fönstret är det enda
    // Alex ser, så det måste säga vad som small i stället för att skylla på sladden.
    console.error(e);
    document.getElementById("crumbs").innerHTML = `<span class="err">panelens ritning small: ${esc(e.message)}</span>`;
    return splashFail("panelen small när den ritades: " + e.message);
  }
  splashHide();
}

// The first answer costs four CLI calls (see README: ~9 s). Say what is happening, and
// say something different when it takes longer than usual.
let splashDone = false, splashFailed = false;   // both stop the spinner's chatter
function splashHide() {
  if (splashDone) return;
  splashDone = true;
  const el = document.getElementById("splash");
  el.classList.add("gone");
  setTimeout(() => el.remove(), 500);
}
function splashFail(message) {
  if (splashDone || splashFailed) return;
  splashFailed = true;
  document.getElementById("splashNote").innerHTML =
    `<span class="err">${esc(message)}</span><br><br>` +
    `<button class="chip" data-act="splash-retry">försök igen</button>`;
  document.querySelector("#splash .spin").hidden = true;
}
[[6000, "fyra anrop: Jira, GitHub, flödets nästa och journalen"],
 [16000, "tar längre tid än vanligt — Jira eller GitHub svarar långsamt"]]
  .forEach(([ms, text]) => setTimeout(() => {
    if (!splashDone && !splashFailed) document.getElementById("splashNote").textContent = text;
  }, ms));

// "#items?scope=shared&prio=High": the view and its filters travel together, so a
// refresh (or a link to Alex's phone) lands on the same screen.
function readHash() {
  const [v, query] = (location.hash || "").slice(1).split("?");
  const p = new URLSearchParams(query || "");
  F.scope = TEXT.scope[p.get("scope")] ? p.get("scope") : "all";
  F.prio = new Set((p.get("prio") || "").split(",").filter(Boolean));
  return TEXT.views[v] ? v : "board";
}
function writeHash() {
  const q = new URLSearchParams();
  if (F.scope !== "all") q.set("scope", F.scope);
  if (F.prio.size) q.set("prio", [...F.prio].join(","));
  location.hash = view + (q.toString() ? "?" + q : "");
}
function show(v) {
  view = TEXT.views[v] ? v : "board";
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.id === "v-" + view));
  writeHash();
  render();
}
document.addEventListener("click", e => {
  if (e.target.closest('[data-act="refresh"]')) return load(true);
  if (e.target.closest('[data-act="imp-parse"]')) return impParse();
  if (e.target.closest('[data-act="imp-apply"]')) return impApply();
  if (e.target.closest('[data-act="imp-all"]')) { IMP.keep = new Set(IMP.plan.map((_, i) => i)); return renderImport(); }
  if (e.target.closest('[data-act="imp-none"]')) { IMP.keep = new Set(); return renderImport(); }
  if (e.target.closest('[data-act="splash-retry"]')) {
    document.getElementById("splashNote").textContent = "hämtar igen …";
    return load(true);
  }
  const scope = e.target.closest("[data-scope]");
  if (scope) { F.scope = scope.dataset.scope; writeHash(); return render(); }
  const prio = e.target.closest("[data-prio]");
  if (prio) {
    const v = prio.dataset.prio;
    if (F.prio.has(v)) F.prio.delete(v);
    else if (F.prio.size && (F.prio.has("utan") || v === "utan")) F.prio.clear(), F.prio.add(v);   // "utan" is not a severity
    else F.prio.add(v);
    writeHash(); return render();
  }
  const t = e.target.closest("[data-v]"); if (!t) return;
  e.preventDefault(); show(t.dataset.v);
});
document.getElementById("refresh").addEventListener("click", () => load(true));
document.getElementById("impFiles").addEventListener("change", e => {
  IMP.files = [...e.target.files]; IMP.note = ""; renderImport();
});
document.getElementById("impProposal").addEventListener("change", e => {
  const box = e.target.closest("[data-keep]");
  if (!box) return;
  const i = Number(box.dataset.keep);
  if (box.checked) IMP.keep.add(i); else IMP.keep.delete(i);
  renderImport();
});
document.getElementById("filter").addEventListener("input", render);
window.addEventListener("hashchange", () => show(readHash()));
show(readHash());
load(false);
setInterval(() => load(false), 60000);
</script>
